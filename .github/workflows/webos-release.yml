name: Build & Release LG webOS IPK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

jobs:
  build-webos-ipk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Install LG webOS TV CLI (ares-cli)
        run: npm install -g @webosose/ares-cli

      - name: Build webOS App & IPK Package
        run: yarn build:webos

      - name: Locate Generated IPK
        id: find-ipk
        run: |
          IPK_FILE=$(ls release-webos/*.ipk | head -n 1)
          echo "Found IPK: $IPK_FILE"
          echo "ipk_path=$IPK_FILE" >> $GITHUB_OUTPUT

      - name: Upload IPK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webos-ipk
          path: ${{ steps.find-ipk.outputs.ipk_path }}

      - name: Attach IPK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find-ipk.outputs.ipk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
