workflows:
  android-release:
    name: Build Android APK/AAB
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20.19.4
      vars:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.jvmargs=-Xmx4g"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - node_modules
        - $HOME/.cache/yarn
    scripts:
      - name: Install Dependencies
        script: |
          yarn install --frozen-lockfile --prefer-offline
      - name: Build Android Release
        script: |
          cd android
          ./gradlew bundleRelease assembleRelease --build-cache --parallel
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt